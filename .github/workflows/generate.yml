name: 写真から投稿文を作って予約

on:
  push:
    branches: [main]
    paths: ["写真を入れる/**"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-post   # 投稿の実行と同時に動いて、予定表を取り合わないように

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 必要な道具を入れる
        run: |
          pip install --quiet anthropic pillow pillow-heif
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: 投稿文を作って予約する
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 generate.py
      - name: 予約を保存する
        run: |
          git config user.name "salon-ai-autopost"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs schedule.json 写真を入れる
          if ! git diff --cached --quiet; then
            git commit -m "写真から予約 $(TZ=Asia/Tokyo date '+%F %H:%M')"
            git pull --rebase --quiet
            git push
          fi
