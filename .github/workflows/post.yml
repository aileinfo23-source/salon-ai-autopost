name: インスタ予約投稿

on:
  schedule:
    # GitHubの定時起動は遅れたり飛ばされたりする（2026-09-17は4時間遅れ、09-18は21時が動かず、
    # 1時間おき4回のうち動いたのは1回だけ）。なので20:03〜翌2:53（日本時間）に10分おきに起動する。
    # 21:00前に動いたら21:00まで待つ。一度出たら、あとの起動は何もしない。0〜3時は前日の分として扱う。
    - cron: "3-59/10 11-17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "テスト（投稿の直前で止める）"
        type: boolean
        default: true
      target_date:
        description: "テストで使う日付（YYYY-MM-DD。空なら今日）"
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-post   # 同時に2つ動いて二重投稿しないように

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: 今日の分を投稿
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          TARGET_DATE: ${{ inputs.target_date }}
          WAIT_UNTIL: ${{ github.event_name == 'schedule' && '21:00' || '' }}
        run: python3 post.py
      - name: 投稿の記録を残す
        if: always()   # 片方が失敗しても、出せた分の記録は必ず残す（二重投稿を防ぐ）
        run: |
          if ! git diff --quiet posted.json; then
            git config user.name "salon-ai-autopost"
            git config user.email "actions@users.noreply.github.com"
            git add posted.json
            git commit -m "投稿記録 $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase --quiet
            git push
          fi
